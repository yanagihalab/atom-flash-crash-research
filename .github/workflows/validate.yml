name: validate-intermediate-data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_release.py --deep
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/verify_cosmos_baseline_indexed.py
      - run: make verify
